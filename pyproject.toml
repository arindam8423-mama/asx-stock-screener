[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asx-stock-screener"
version = "0.1.0"
description = "Research-first ASX stock screener and backtesting platform"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0,<2.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=17,<22",
    "pydantic-settings>=2.4,<3.0",
    "xlrd>=2.0,<3.0",
    "yfinance>=0.2.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
asx-screener = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
